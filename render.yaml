services:
  - type: web
    name: hotel-distribuido
    runtime: node
    plan: free
    region: oregon # região do serviço já criado no Render (não pode ser alterada depois)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # cole a connection string DIRETA do Neon (sem -pooler)
      - key: RECEPTION_PIN
        sync: false
      - key: HOLD_SECONDS
        value: "120"
